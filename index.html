            </svg>
          </button>
          <button id="cancel-btn" class="action-btn cancel-btn hidden" title="Отменить">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="save-btn" class="action-btn save-btn hidden" title="Сохранить">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polyline points="5,12 10,17 19,7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Список персонажей -->
      <div class="characters-list" id="characters-list"></div>

      <!-- Кнопка "+" (только в режиме редактирования) -->
      <button id="add-character-btn" class="add-character-btn hidden">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>

    </aside>
  </div>
</div>

<!-- ============================================================
     МОДАЛКА: ВЫБОР КЛАССА
     ============================================================ -->
<div id="modal-classes" class="modal-overlay">
  <div class="modal">
    <button id="modal-close" class="modal-close" title="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Шаг 1: сетка классов -->
    <div id="modal-step-classes" class="modal-step active">
      <h3 class="modal-title">Выберите класс</h3>
      <div class="class-grid" id="class-grid"></div>
    </div>

    <!-- Шаг 2: ввод имени -->
    <div id="modal-step-name" class="modal-step">
      <div class="name-input-row">
        <input
          type="text"
          id="new-char-name"
          class="name-input"
          placeholder="Имя персонажа"
          maxlength="32"
          autocomplete="off"
          spellcheck="false"
        >
        <button id="name-send" class="name-send" title="Создать">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12 L20 4 L14 20 L12 13 Z" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <p id="name-error" class="name-error"></p>
    </div>
  </div>
</div>

<!-- ============================================================
     ТОСТ (уведомления)
     ============================================================ -->
<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>

</html>
