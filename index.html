<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КП Drugs — Панель</title>
  
  <!-- ПРАВКА 2: Добавлен шрифт Marcellus -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SVG-спрайт (скрытый) -->
  <svg class="svg-defs">
    <defs>
      <!-- Здесь будут ваши <symbol id="berserker" viewBox="..."> и другие иконки -->
    </defs>
  </svg>

  <!-- Экран загрузки -->
  <div id="screen-loading" class="screen screen-loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Загрузка...</div>
  </div>

  <!-- Экран "сервер недоступен" -->
  <div id="screen-offline" class="screen screen-offline">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
      </svg>
    </div>
    <div class="offline-text">Сервер недоступен</div>
    <div class="offline-hint">Обновите страницу и попробуйте снова</div>
  </div>

  <!-- Экран логина -->
  <div id="screen-login" class="screen screen-login">
    <div class="login-box">
      <div class="login-emblem">
        <svg viewBox="0 0 100 100" fill="none">
          <!-- Эмблема -->
          <circle cx="50" cy="50" r="45" stroke="var(--gold)" stroke-width="2"/>
          <text x="50" y="55" text-anchor="middle" fill="var(--gold)" font-family="var(--font-display)" font-size="24">DRUGS</text>
        </svg>
      </div>
      <form id="login-form" class="login-form">
        <input id="login-key" type="text" class="login-input" placeholder="КЛЮЧ ДОСТУПА" autocomplete="off">
        <button type="submit" class="login-btn">Войти</button>
        <div id="login-error" class="login-error"></div>
      </form>
    </div>
  </div>

  <!-- Основной экран -->
  <div id="screen-main" class="screen screen-main">
    <header class="header">
      <div id="header-nickname" class="header-nickname">—</div>
      <button id="logout-btn" class="logout-btn">Выйти</button>
    </header>

    <div class="main-layout">
      <!-- Левая колонка (рейды) -->
      <div class="raids-panel">
        <div class="raids-placeholder">
          <div class="raids-placeholder-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <div class="raids-placeholder-text">Расписание рейдов</div>
          <div class="raids-placeholder-hint">Скоро</div>
        </div>
      </div>

      <!-- Правая колонка (персонажи) -->
      <div class="characters-panel">
        <div class="characters-header">
          <div class="characters-title">Мои персонажи</div>
          <div class="characters-actions">
            <button id="edit-btn" class="action-btn" title="Редактировать">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button id="cancel-btn" class="action-btn cancel-btn hidden" title="Отменить">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <button id="save-btn" class="action-btn save-btn hidden" title="Сохранить">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </div>
        </div>
        
        <div id="characters-list" class="characters-list">
          <!-- Карточки персонажей рендерятся здесь -->
        </div>
        
        <button id="add-character-btn" class="add-character-btn hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Модалка выбора класса -->
  <div id="modal-classes" class="modal-overlay">
    <div class="modal">
      <button id="modal-close" class="modal-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      
      <!-- Шаг 1: Выбор класса -->
      <div id="modal-step-classes" class="modal-step active">
        <div class="modal-title">Выберите класс</div>
        <div id="class-grid" class="class-grid">
          <!-- Классы рендерятся здесь -->
        </div>
      </div>
      
      <!-- Шаг 2: Ввод имени -->
      <div id="modal-step-name" class="modal-step">
        <div class="modal-title">Введите имя персонажа</div>
        <div class="name-input-row">
          <input id="new-char-name" type="text" class="name-input" placeholder="Имя персонажа" autocomplete="off">
          <button id="name-send" class="name-send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>
        <div id="name-error" class="name-error"></div>
      </div>
    </div>
  </div>

  <!-- Тост -->
  <div id="toast" class="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
